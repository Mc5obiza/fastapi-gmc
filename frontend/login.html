<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0c13">
    <title>Log in - GMC AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand" href="login.html" aria-label="GMC AI Assistant">
        <span class="brand-mark" aria-hidden="true">g</span>
        <span>gmc<span class="brand-light">.ai</span></span>
      </a>
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to your account</h1>
      <p class="auth-description">Continue learning with your personal study companion.</p>

      <form class="auth-form" id="auth-form" data-endpoint="/auth/login">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p class="auth-error" id="auth-error" role="alert" aria-live="polite"></p>
        <button class="auth-submit" type="submit">Log in</button>
      </form>

      <p class="auth-switch">New to GMC AI? <a href="signup.html">Create an account</a></p>
    </main>
  </body>
</html>
